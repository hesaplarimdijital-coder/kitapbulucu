[versions]
# Compose 1.12 (desktop-kit 2.x) needs AGP 9.1.1+ and compileSdk 37
agp = "9.4.1"
# AGP 9 compiles Kotlin itself; the root build file pins this version. Haze 2 (from the kit) needs 2.3+.
kotlin = "2.4.20"
# the kit 2.9.0 merge commit (PR #14) until the 2.9.0 Release exists; the CI reads this line as is
desktopKit = "2.9.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
junit = "4.13.2"
robolectric = "4.17"
testCore = "1.7.0"
testExtJunit = "1.3.0"

[libraries]
desktop-kit = { module = "com.github.hesaplarimdijital-coder:desktop-kit", version.ref = "desktopKit" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Never applied (AGP 9 compiles Kotlin itself); declared in the root build file only to pin the Kotlin version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
