# Builds the app, runs the unit tests (including the Robolectric screenshot tests), checks that
# the APK never asks for internet access and publishes the APK as a workflow artifact. On main the
# screenshots are pushed to the ci/screenshots branch for review. Build errors and failed tests
# are reported as annotations on the commit.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # JitPack builds a kit version on its first request, which can outlast Gradle's read timeout.
      - name: Wait for desktop-kit on JitPack
        run: |
          version=$(sed -n 's/^desktopKit = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          base="https://jitpack.io/com/github/hesaplarimdijital-coder/desktop-kit/$version"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$base/desktop-kit-$version.pom" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 15
          done
          echo "::error::desktop-kit $version is not available on JitPack; its build log follows"
          curl -s --max-time 60 "$base/build.log" | tail -80
          exit 1

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kitapbulucu.jks"
            echo "KB_KEYSTORE=$RUNNER_TEMP/kitapbulucu.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KB_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi

      - name: Build and test
        env:
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --continue --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: No internet permission
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::The APK requests android.permission.INTERNET"
            exit 1
          fi

      - name: Check sample workbooks with openpyxl and LibreOffice
        if: success()
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v soffice >/dev/null; then
            timeout 240 sudo -E apt-get update -qq >/dev/null && timeout 300 sudo -E apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui >/dev/null \
              || echo "::warning::LibreOffice could not be installed; only openpyxl checks the samples"
          fi
          pip install -q openpyxl
          python3 tools/ci/check_samples.py app/build/outputs/samples

      - name: Annotate errors
        if: failure()
        run: |
          python3 tools/ci/annotate_gradle_errors.py build.log
          python3 tools/ci/annotate_test_failures.py app/build/test-results

      - name: Compare screenshots
        if: always()
        run: |
          pip install --quiet pillow
          python3 tools/ci/screenshot_report.py app/build/outputs/screenshots app/src/test/screenshots app/build/outputs/screenshots/diff

      - name: Push screenshots to ci/screenshots
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          src=app/build/outputs/screenshots
          [ -d "$src" ] || exit 0
          out="$RUNNER_TEMP/screenshots"
          rm -rf "$out" && cp -r "$src" "$out"
          cd "$out"
          git init -q && git checkout -q --orphan ci/screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/screenshots

      - name: APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kitapbulucu-apk
          path: app/build/outputs/apk/release/*.apk

      # The same APK as a plain file on the ci/apk branch, so a tablet can download it from
      # https://github.com/<owner>/<repo>/raw/ci/apk/kitapbulucu.apk without unpacking a zip.
      # The sample workbooks the writer produced go along under ornek/.
      - name: Push APK to ci/apk
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/apk"
          rm -rf "$out" && mkdir -p "$out"
          cp app/build/outputs/apk/release/*.apk "$out/kitapbulucu.apk"
          cp -r app/build/outputs/samples "$out/ornek"
          printf 'Kitap Bulucu %s\nCommit %s\n' "$(date -u +%Y-%m-%dT%H:%MZ)" "${GITHUB_SHA::7}" > "$out/SURUM.txt"
          cd "$out"
          git init -q && git checkout -q --orphan ci/apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/apk

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
